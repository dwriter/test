<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Учёт часов</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#dce3ec;
  --accent:#2563eb;--accent2:#dbeafe;--today:#ff8a00;--good:#0f766e;
  --danger:#b91c1c;--shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.shell{max-width:980px;margin:0 auto;padding:14px 12px 92px}
.topbar{position:sticky;top:0;z-index:20;margin:-14px -12px 14px;padding:12px 12px 10px;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(220,227,236,.85)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.02em}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}
.month-nav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;margin-top:10px}
.icon-btn,.month-title,.tab-btn,.primary,.secondary,.danger,.small-btn{
  border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--ink)
}
.icon-btn{height:42px;font-size:22px}
.month-title{height:42px;font-weight:750;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.kpi .label{font-size:12px;color:var(--muted);margin-bottom:5px}
.kpi .value{font-size:22px;font-weight:850;letter-spacing:-.03em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.day-head{display:grid;grid-template-columns:82px minmax(180px,1fr) 150px;gap:8px;padding:10px 12px;background:#eef2f7;color:var(--muted);font-size:12px;font-weight:700;position:sticky;top:112px;z-index:9}
.day-row{display:grid;grid-template-columns:82px minmax(180px,1fr) 150px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid #edf1f5;min-height:59px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.day-row.today{outline:3px solid var(--today);outline-offset:-3px}
.day-row.off-day{background:#eef1f5;color:#667085}
.day-row.work-mon{background:#eef6ff}
.day-row.work-thu{background:#eefbf3}
.day-row.work-fri{background:#f6f0ff}
.day-row.work-sun{background:#fff0f1}
.day-row:hover{box-shadow:inset 0 0 0 1px rgba(37,99,235,.12)}
.date-main{font-weight:800;font-size:16px}
.date-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hours-control{display:grid;grid-template-columns:38px 1fr 38px;gap:6px;align-items:center}
.small-btn{height:38px;font-size:20px;font-weight:700}
.hours-input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:750;padding:0 4px}
.row-template-btn{width:100%;margin-top:6px;min-height:30px;border:1px solid #bfdbfe;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:850;padding:4px 6px}
.row-template-btn:disabled{background:#f3f4f6;border-color:#e5e7eb;color:#9ca3af}
.sum{text-align:right;font-weight:800}
.sum small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.section-title{font-size:17px;font-weight:850;margin:18px 2px 9px}
.summary-list{padding:4px 12px}
.summary-row{display:grid;grid-template-columns:1fr 100px 130px;gap:8px;padding:11px 4px;border-bottom:1px solid #edf1f5;align-items:center}
.summary-row:last-child{border-bottom:0}
.summary-row.header{color:var(--muted);font-size:12px;font-weight:700}
.summary-row strong{text-align:right}
.total-row{background:#f8fafc;font-weight:800}
.settings{padding:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}
.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.week-item{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.primary,.secondary,.danger{min-height:44px;padding:10px 12px;font-weight:750}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.secondary{background:#fff}
.danger{background:#fff;color:var(--danger);border-color:#fecaca}
.note{font-size:12px;line-height:1.5;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(980px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(244,247,251,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:30}
.tab-btn{height:46px;font-weight:750}
.tab-btn.active{background:#172033;color:#fff;border-color:#172033}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,16px);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

.today-dashboard{display:grid;gap:12px;max-width:720px;margin:0 auto}
.today-card{padding:20px;border:2px solid #fed7aa;background:linear-gradient(180deg,#fffaf3 0%,#fff 70%)}
.today-date{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.today-date .eyebrow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.today-date h2{margin:4px 0 0;font-size:27px;line-height:1.08;letter-spacing:-.03em}
.today-badge{background:var(--today);color:#fff;font-size:12px;font-weight:850;border-radius:999px;padding:7px 10px;white-space:nowrap}
.today-hours-block{text-align:center;padding:8px 0 2px}
.today-hours-label{color:var(--muted);font-size:13px;font-weight:700}
.today-hours-value{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:3px 0 12px}
.today-hours-value strong{font-size:58px;line-height:1;font-weight:900;letter-spacing:-.06em}
.today-hours-value span{font-size:19px;color:var(--muted);font-weight:700}
.today-input{width:120px;height:50px;border:1px solid var(--line);border-radius:13px;text-align:center;font-size:21px;font-weight:850;background:#fff}
.quick-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick-btn{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:50px;font-weight:850;font-size:16px;color:var(--ink);transition:transform .12s ease,filter .12s ease}
.quick-btn:active{transform:scale(.98)}
.preset-label{margin-top:18px;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.hour-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.preset-btn{min-height:44px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:16px}
.preset-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 5px 14px rgba(37,99,235,.18)}
.month-overview{margin:12px 0}
.month-overview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.month-overview .kpi{box-shadow:none;margin:0}
.month-progress{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow)}
.month-progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:8px}
.month-progress-track{height:11px;background:#e8edf4;border-radius:999px;overflow:hidden}
.month-progress-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:999px;transition:width .2s ease}
.quick-btn.sub{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
.quick-btn.add{background:#dcfce7;border-color:#bbf7d0;color:#166534}
.today-income{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.today-income-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
.today-income-box .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.today-income-box .value{font-size:21px;font-weight:900}
.today-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.today-secondary{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;font-weight:750}
.today-month-card{padding:14px 16px}
.today-progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.today-progress-head strong{font-size:16px}
.today-progress-head span{color:var(--muted);font-size:12px}
.today-progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today-mini{padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}
.today-mini .label{font-size:11px;color:var(--muted)}
.today-mini .value{font-size:17px;font-weight:850;margin-top:3px}
.outside-period{padding:28px 18px;text-align:center}
.outside-period h2{margin:0 0 8px;font-size:23px}
.outside-period p{color:var(--muted);line-height:1.5;margin:0 0 18px}
@media (max-width:700px){
  .shell{padding-left:8px;padding-right:8px}
  .topbar{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:7px}
  .kpi{padding:11px}.kpi .value{font-size:19px}
  .day-head{display:none}
  .card.days{background:transparent;border:0;box-shadow:none;overflow:visible}
  .day-row{grid-template-columns:78px 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:10px;box-shadow:0 4px 16px rgba(15,23,42,.045)}
  .day-row.off-day{background:#eef1f5}
  .day-row.work-mon{background:#eef6ff}
  .day-row.work-thu{background:#eefbf3}
  .day-row.work-fri{background:#f6f0ff}
  .day-row.work-sun{background:#fff0f1}
  .day-row .hours-wrap{grid-column:1 / 2;grid-row:2}
  .day-row .sum{grid-column:2;grid-row:2;text-align:right}
  .hours-control{grid-template-columns:34px 58px 34px;justify-content:start}
  .small-btn,.hours-input{height:36px}
  .sum{font-size:16px}
  .form-grid,.actions,.week-grid{grid-template-columns:1fr}
  .week-item{grid-template-columns:1fr 145px}
  .summary-row{grid-template-columns:1fr 72px 110px}
  .tabs{grid-template-columns:repeat(4,1fr);gap:5px;padding-left:7px;padding-right:7px}
  .tab-btn{font-size:12px;height:45px;padding:0 4px}
  .today-card{padding:16px}
  .today-date h2{font-size:24px}
  .today-hours-value strong{font-size:54px}
  .quick-buttons{grid-template-columns:repeat(2,1fr)}
  .hour-presets{grid-template-columns:repeat(5,1fr);gap:5px}
  .preset-btn{min-height:42px;font-size:15px;padding:0}
  .month-overview-grid{grid-template-columns:repeat(2,1fr)}
  .month-overview-grid .kpi:last-child{grid-column:1 / -1}
  .today-income{grid-template-columns:1fr 1fr}
  .today-progress-grid{grid-template-columns:1fr 1fr 1fr}
  .today-mini{padding:9px 7px}
  .today-mini .value{font-size:15px}
}

.pwa-box{display:grid;gap:10px}
.pwa-status{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--muted);font-size:13px;line-height:1.45}
.pwa-status strong{color:var(--ink)}
.install-btn:disabled{opacity:.55;cursor:default}

/* v9: multi-year, work templates, chart and month lock */
.brand-controls{display:flex;align-items:center;gap:8px}
.year-picker{height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 9px;font-weight:800;color:var(--ink)}
.work-tue{background:#fff7e6}
.work-wed{background:#ecfeff}
.work-sat{background:#fff7ed}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.template-item{display:grid;grid-template-columns:1fr 95px;align-items:center;gap:10px;padding:9px 10px;border:1px solid #edf1f5;border-radius:12px;background:#fafcff}
.template-item span{font-weight:750}
.template-item small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.template-item input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;text-align:center;font-weight:800}
.template-apply{width:100%;margin-top:10px;min-height:46px;border:1px solid #bfdbfe;border-radius:13px;background:#eff6ff;color:#1d4ed8;font-weight:850}
.lock-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;margin-bottom:12px;border:1px solid #fde68a;background:#fffbeb;border-radius:13px}
.lock-banner strong{display:block;font-size:13px}.lock-banner span{display:block;color:#92400e;font-size:12px;margin-top:2px}
.lock-btn{min-height:40px;border:1px solid #f59e0b;background:#fff7ed;color:#9a3412;border-radius:11px;padding:8px 12px;font-weight:800;white-space:nowrap}
.month-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-top:10px;box-shadow:var(--shadow)}
.month-tools .text strong{display:block}.month-tools .text span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.chart-card{margin-top:10px;padding:12px 12px 8px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}.chart-head strong{font-size:14px}.chart-head span{font-size:12px;color:var(--muted)}
.income-chart{width:100%;height:auto;display:block;overflow:visible}
.chart-empty{padding:32px 10px;text-align:center;color:var(--muted);font-size:13px}
.year-list{display:grid;gap:8px;margin-top:10px}.year-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid #edf1f5;border-radius:12px;background:#fafcff}.year-row.active{border-color:#bfdbfe;background:#eff6ff}.year-row strong{font-size:14px}.year-row span{font-size:12px;color:var(--muted)}
.locked-field{opacity:.62}
button:disabled,input:disabled{cursor:not-allowed;opacity:.55}
.summary-lock{font-size:12px;margin-left:5px}
@media (max-width:700px){
  .brand{align-items:flex-start}.brand-controls{flex-direction:column;align-items:flex-end;gap:3px}.year-picker{height:34px;max-width:112px}
  .template-grid{grid-template-columns:1fr}.month-tools{align-items:flex-start;flex-direction:column}.month-tools button{width:100%}
  .lock-banner{align-items:flex-start;flex-direction:column}.lock-banner .lock-btn{width:100%}
}

</style>
</head>

"use strict";
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

function clone(o){return JSON.parse(JSON.stringify(o))}
function key(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function monthKey(y,m){return `${y}-${String(m).padStart(2,"0")}`}
function daysIn(y,m){return new Date(y,m,0).getDate()}
function academicId(startYear){return `${startYear}-${String((startYear+1)%100).padStart(2,"0")}`}
function academicLabel(startYear){return `${startYear}/${String((startYear+1)%100).padStart(2,"0")}`}
function makePeriod(startYear){
  return [9,10,11,12].map(m=>({y:startYear,m})).concat([1,2,3,4,5,6].map(m=>({y:startYear+1,m})));
}
function inferStartYear(y,m){return m>=9?y:y-1}
function blankYear(startYear){
  const entries={};
  makePeriod(startYear).forEach(p=>{for(let d=1;d<=daysIn(p.y,p.m);d++)entries[key(p.y,p.m,d)]={hours:null}});
  return {startYear,entries,closedMonths:{}};
}
function normalizeTemplates(raw){
  const defaults={"0":5,"1":6,"2":0,"3":0,"4":5,"5":6,"6":0}, out={};
  for(let wd=0;wd<=6;wd++){
    const v=raw&&raw[String(wd)]!==undefined?Number(raw[String(wd)]):defaults[String(wd)];
    out[String(wd)]=Number.isFinite(v)&&v>=0?v:defaults[String(wd)];
  }
  return out;
}
function normalizeYear(raw,startYear){
  const yr=blankYear(startYear), src=(raw&&raw.entries)||{};
  Object.keys(yr.entries).forEach(k=>{
    const val=src[k]&&src[k].hours;
    const n=(val===null||val===""||typeof val==="undefined")?null:Number(val);
    yr.entries[k]={hours:Number.isFinite(n)&&n>0?n:null};
  });
  const closed=(raw&&raw.closedMonths)||{};
  yr.closedMonths={};
  makePeriod(startYear).forEach(p=>{const mk=monthKey(p.y,p.m);if(closed[mk])yr.closedMonths[mk]=true});
  return yr;
}
function normalizeState(raw){
  raw=raw||{};const s=raw.settings||{};
  const settings={
    weekdayRate:Math.max(0,Number(s.weekdayRate)||1900),
    weekendRate:Math.max(0,Number(s.weekendRate)||2100),
    hourStep:Math.max(.1,Number(s.hourStep)||.5),
    templates:normalizeTemplates(s.templates)
  };
  const years={};
  if(raw.version>=3&&raw.years&&typeof raw.years==="object"){
    Object.keys(raw.years).forEach(id=>{
      const r=raw.years[id]||{};const sy=Number(r.startYear)||Number(String(id).slice(0,4));
      if(Number.isInteger(sy)&&sy>=2000&&sy<=2100)years[academicId(sy)]=normalizeYear(r,sy);
    });
  }else{
    const sy=2026, legacy={entries:raw.entries||{},closedMonths:{}};
    years[academicId(sy)]=normalizeYear(legacy,sy);
  }
  if(!Object.keys(years).length)years[academicId(2026)]=blankYear(2026);
  const sorted=Object.keys(years).sort((a,b)=>years[a].startYear-years[b].startYear);
  const active=years[raw.activeYear]?raw.activeYear:(years[academicId(2026)]?academicId(2026):sorted[0]);
  return {version:3,appId:"income-hours-multiyear-v1",updatedAt:raw.updatedAt||"1970-01-01T00:00:00.000Z",settings,activeYear:active,years};
}
const FACTORY=normalizeState(FACTORY_RAW);

function activeStartYear(){return activeYearData().startYear}

function loadState(){
  let local=null;try{local=JSON.parse(localStorage.getItem(storageKey)||"null")}catch(e){}
  if(local){
    const l=normalizeState(local);
    if(new Date(local.updatedAt||0)>=new Date(EMBEDDED_RAW.updatedAt||0))return l;
  }
  return clone(EMBEDDED);
}

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove("show"),1900)}
function getEntry(y,m,d){
  const yr=activeYearData(),k=key(y,m,d);if(!yr.entries[k])yr.entries[k]={hours:null};return yr.entries[k];
}
function dateInfo(y,m,d){const dt=new Date(y,m-1,d,12);return {dt,wd:dt.getDay()}}
function rateFor(y,m,d){const wd=dateInfo(y,m,d).wd;return wd===0||wd===6?+state.settings.weekendRate||0:+state.settings.weekdayRate||0}
function dayAmount(y,m,d){const h=Number(getEntry(y,m,d).hours);return Number.isFinite(h)&&h>0?h*rateFor(y,m,d):0}
function templateHoursFor(y,m,d){return Number(state.settings.templates[String(dateInfo(y,m,d).wd)]||0)}
function isMonthClosed(y,m){return !!activeYearData().closedMonths[monthKey(y,m)]}
function ensureEditable(y,m){if(isMonthClosed(y,m)){toast("Месяц закрыт. Сначала разблокируйте его.");return false}return true}
function monthStats(y,m,cutoff=null){
  let hours=0,amount=0,weekdayHours=0,weekendHours=0,workedDays=0;
  for(let d=1;d<=daysIn(y,m);d++){
    if(cutoff!==null&&d>cutoff)break;
    const h=Number(getEntry(y,m,d).hours);
    if(Number.isFinite(h)&&h>0){hours+=h;amount+=h*rateFor(y,m,d);workedDays++;const wd=dateInfo(y,m,d).wd;if(wd===0||wd===6)weekendHours+=h;else weekdayHours+=h}
  }
  return {hours,amount,weekdayHours,weekendHours,workedDays};
}
function monthProgressInfo(y,m){
  const now=new Date(),total=daysIn(y,m),target=new Date(y,m-1,1,12),current=new Date(now.getFullYear(),now.getMonth(),1,12);
  if(target<current)return {pct:100,label:`${total} из ${total} дней`};if(target>current)return {pct:0,label:`0 из ${total} дней`};
  const elapsed=Math.min(now.getDate(),total);return {pct:Math.round(elapsed/total*100),label:`${elapsed} из ${total} дней`};
}
function periodStats(cutToday=false){
  const now=new Date();let hours=0,amount=0,weekdayHours=0,weekendHours=0;
  activePeriod().forEach(p=>{
    if(cutToday){const first=new Date(p.y,p.m-1,1,12),curFirst=new Date(now.getFullYear(),now.getMonth(),1,12);if(first>curFirst)return;const cutoff=(p.y===now.getFullYear()&&p.m===now.getMonth()+1)?now.getDate():null;const s=monthStats(p.y,p.m,cutoff);hours+=s.hours;amount+=s.amount;weekdayHours+=s.weekdayHours;weekendHours+=s.weekendHours}
    else{const s=monthStats(p.y,p.m);hours+=s.hours;amount+=s.amount;weekdayHours+=s.weekdayHours;weekendHours+=s.weekendHours}
  });return {hours,amount,weekdayHours,weekendHours};
}
function periodStatsThroughDate(y,m,d){
  let hours=0,amount=0,weekdayHours=0,weekendHours=0;
  for(const p of activePeriod()){
    const cur=new Date(p.y,p.m-1,1,12),target=new Date(y,m-1,1,12);if(cur>target)break;
    const cutoff=(p.y===y&&p.m===m)?d:null,s=monthStats(p.y,p.m,cutoff);hours+=s.hours;amount+=s.amount;weekdayHours+=s.weekdayHours;weekendHours+=s.weekendHours;
  }return {hours,amount,weekdayHours,weekendHours};
}
function todayAmountFor(y,m){
  const now=new Date(),target=new Date(y,m-1,1,12),cur=new Date(now.getFullYear(),now.getMonth(),1,12);
  if(target>cur)return {hours:0,amount:0,weekdayHours:0,weekendHours:0};if(target<cur)return monthStats(y,m);return monthStats(y,m,now.getDate());

function rub(v){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(v))+" ₽"}

function todayView(){

}
function monthNav(){const p=activePeriod()[view.idx];return `<div class="month-nav"><button class="icon-btn" id="prevMonth" ${view.idx===0?"disabled":""}>‹</button><button class="month-title" id="monthPicker">${MONTHS[p.m-1]} ${p.y}</button><button class="icon-btn" id="nextMonth" ${view.idx===activePeriod().length-1?"disabled":""}>›</button></div>`}

function incomeChartSvg(y,m){

  for(let d=1;d<=daysIn(p.y,p.m);d++){
    const inf=dateInfo(p.y,p.m,d),e=getEntry(p.y,p.m,d),tpl=templateHoursFor(p.y,p.m,d),isToday=p.y===now.getFullYear()&&p.m===now.getMonth()+1&&d===now.getDate(),dayClass=dayClassFor(inf.wd,tpl),dayType=tpl>0?`рабочий · обычно ${num(tpl)} ч`:"нерабочий",disabled=closed?"disabled":"";
    rows.push(`<div class="day-row ${isToday?"today":""} ${dayClass}" data-open-day="1" data-y="${p.y}" data-m="${p.m}" data-d="${d}"><div><div class="date-main">${d} ${WD[inf.wd]}</div><div class="date-sub">${dayType}</div></div><div class="hours-wrap"><div class="hours-control"><button class="small-btn" data-action="minus" data-y="${p.y}" data-m="${p.m}" data-d="${d}" ${disabled}>−</button><input class="hours-input" data-action="hours" data-y="${p.y}" data-m="${p.m}" data-d="${d}" type="number" inputmode="decimal" min="0" step="${state.settings.hourStep||0.5}" value="${e.hours??""}" placeholder="0" ${disabled}><button class="small-btn" data-action="plus" data-y="${p.y}" data-m="${p.m}" data-d="${d}" ${disabled}>+</button></div><button class="row-template-btn" data-template-day="1" data-y="${p.y}" data-m="${p.m}" data-d="${d}" ${closed||tpl<=0?"disabled":""}>Как обычно${tpl>0?` · ${num(tpl)} ч`:""}</button></div><div class="sum">${rub(dayAmount(p.y,p.m,d))}<small>${rateFor(p.y,p.m,d)} ₽/ч</small></div></div>`);
  }
  const progress=monthProgressInfo(p.y,p.m),avgDay=full.workedDays?full.amount/full.workedDays:0;
  return `<section class="month-overview"><div class="month-overview-grid"><div class="kpi"><div class="label">Заработано</div><div class="value">${rub(full.amount)}</div><div class="sub">${full.workedDays} рабочих дней</div></div><div class="kpi"><div class="label">Всего часов</div><div class="value">${num(full.hours)} ч</div><div class="sub">на сегодня: ${num(to.hours)} ч</div></div><div class="kpi"><div class="label">Будни</div><div class="value">${num(full.weekdayHours)} ч</div><div class="sub">понедельник–пятница</div></div><div class="kpi"><div class="label">Выходные</div><div class="value">${num(full.weekendHours)} ч</div><div class="sub">суббота–воскресенье</div></div><div class="kpi"><div class="label">Средний доход / рабочий день</div><div class="value">${full.workedDays?rub(avgDay):"—"}</div><div class="sub">по дням с внесёнными часами</div></div></div><div class="month-progress"><div class="month-progress-head"><span>Прогресс месяца</span><strong>${progress.label} · ${progress.pct}%</strong></div><div class="month-progress-track"><div class="month-progress-fill" style="width:${progress.pct}%"></div></div></div></section>
    <section class="chart-card"><div class="chart-head"><strong>Накопленный доход</strong><span>${rub(full.amount)} за месяц</span></div>${incomeChartSvg(p.y,p.m)}</section>
    <section class="month-tools"><div class="text"><strong>${closed?"🔒 Месяц закрыт":"Редактирование месяца открыто"}</strong><span>${closed?"Часы можно просматривать, но нельзя случайно изменить.":"После завершения месяца его можно защитить от изменений."}</span></div><button class="${closed?"secondary":"lock-btn"}" data-toggle-month-lock="1" data-y="${p.y}" data-m="${p.m}">${closed?"Разблокировать месяц":"Закрыть месяц"}</button></section>
    <section class="card days" style="margin-top:10px"><div class="day-head"><div>Дата</div><div>Часы</div><div style="text-align:right">Сумма</div></div>${rows.join("")}</section>`;
}
function summaryView(){
  let totalH=0,totalA=0,totalWeekdayH=0,totalWeekendH=0;const now=new Date(),period=activePeriod();
  const rows=period.map((p,i)=>{const s=monthStats(p.y,p.m);totalH+=s.hours;totalA+=s.amount;totalWeekdayH+=s.weekdayHours;totalWeekendH+=s.weekendHours;const isCur=p.y===now.getFullYear()&&p.m===now.getMonth()+1,lock=isMonthClosed(p.y,p.m)?`<span class="summary-lock">🔒</span>`:"";return `<div class="summary-row ${isCur?"today":""}" data-open-month="${i}"><span>${MONTHS[p.m-1]} ${p.y}${lock}</span><strong>${num(s.hours)} ч</strong><strong>${rub(s.amount)}</strong></div>`});
  const to=periodStats(true);return `<section class="kpis"><div class="kpi"><div class="label">По сегодня</div><div class="value">${rub(to.amount)}</div><div class="sub">${num(to.hours)} ч</div></div><div class="kpi"><div class="label">Учебный год ${academicLabel(activeStartYear())}</div><div class="value">${rub(totalA)}</div><div class="sub">${num(totalH)} ч</div></div><div class="kpi"><div class="label">Будни · учебный год</div><div class="value">${num(totalWeekdayH)} ч</div><div class="sub">понедельник–пятница</div></div><div class="kpi"><div class="label">Выходные · учебный год</div><div class="value">${num(totalWeekendH)} ч</div><div class="sub">суббота–воскресенье</div></div></section><div class="section-title">По месяцам</div><section class="card summary-list"><div class="summary-row header"><span>Месяц</span><strong>Часы</strong><strong>Сумма</strong></div>${rows.join("")}<div class="summary-row total-row"><span>Итого</span><strong>${num(totalH)} ч</strong><strong>${rub(totalA)}</strong></div></section>`;
}
function settingsView(){
  const templateRows=TEMPLATE_ORDER.map(wd=>`<div class="template-item"><div><span>${WD_FULL[wd]}</span><small>${state.settings.templates[String(wd)]>0?"рабочий день":"нерабочий день"}</small></div><input data-template-setting="${wd}" type="number" min="0" step="0.5" value="${esc(state.settings.templates[String(wd)])}"></div>`).join("");
  const yearRows=sortedYearIds().map(id=>{const y=state.years[id],s=yearStats(id);return `<div class="year-row ${id===state.activeYear?"active":""}"><div><strong>${academicLabel(y.startYear)}</strong><span>${num(s.hours)} ч · ${rub(s.amount)}</span></div><button class="secondary" data-switch-year="${id}" ${id===state.activeYear?"disabled":""}>${id===state.activeYear?"Выбран":"Открыть"}</button></div>`}).join("");
  return `<div class="section-title">Расчёт</div><section class="card settings"><div class="form-grid"><div class="field"><label>Будни, ₽/час</label><input id="weekdayRate" type="number" min="0" step="50" value="${esc(state.settings.weekdayRate)}"></div><div class="field"><label>Выходные, ₽/час</label><input id="weekendRate" type="number" min="0" step="50" value="${esc(state.settings.weekendRate)}"></div><div class="field"><label>Шаг изменения часов</label><input id="hourStep" type="number" min="0.1" step="0.1" value="${esc(state.settings.hourStep||0.5)}"></div></div></section>
  <div class="section-title">Обычная рабочая неделя</div><section class="card settings"><div class="note" style="margin-top:0">Укажите обычное число часов. <b>0</b> означает нерабочий день. В карточке дня появится кнопка «Как обычно».</div><div class="template-grid">${templateRows}</div></section>
  <div class="section-title">Учебные годы</div><section class="card settings"><div class="year-list">${yearRows}</div><div class="actions"><button class="primary" id="createNextYear">+ Создать следующий учебный год</button><button class="danger" id="resetActiveYear">Сбросить только ${academicLabel(activeStartYear())}</button></div><div class="note">Новый учебный год создаётся пустым и охватывает сентябрь–июнь. Ставки и шаблон недели общие для всех лет.</div></section>
  <div class="section-title">Приложение</div><section class="card settings"><div class="pwa-box"><button class="primary install-btn" id="installApp">Установить на телефон</button><div class="pwa-status" id="pwaStatus">${pwaInstallStatusHtml()}</div></div></section>
  <div class="section-title">Резервные копии</div><section class="card settings"><div class="actions"><button class="primary" id="saveHtml">Сохранить HTML с данными</button><button class="secondary" id="exportJson">Скачать копию JSON</button><button class="secondary" id="importJson">Импортировать JSON</button><button class="secondary" id="exportCsv">Экспорт CSV</button></div><input id="fileInput" type="file" accept=".json,application/json" class="hidden"><div class="note"><b>Автосохранение:</b> данные всех учебных лет хранятся локально на этом устройстве. JSON-копия содержит сразу все годы и настройки.</div></section>`;
}
function yearStats(id){
  const prev=state.activeYear;state.activeYear=id;let hours=0,amount=0;for(const p of activePeriod()){const s=monthStats(p.y,p.m);hours+=s.hours;amount+=s.amount}state.activeYear=prev;return {hours,amount};
}
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;view.selectedDay=null;view.scrolled=false;render()});
  const yp=document.getElementById("yearPicker");if(yp)yp.onchange=()=>switchYear(yp.value);
  const prev=document.getElementById("prevMonth");if(prev)prev.onclick=()=>{if(view.idx>0){view.idx--;view.selectedDay=null;view.scrolled=false;render()}};
  const next=document.getElementById("nextMonth");if(next)next.onclick=()=>{if(view.idx<activePeriod().length-1){view.idx++;view.selectedDay=null;view.scrolled=false;render()}};
  const pick=document.getElementById("monthPicker");if(pick)pick.onclick=cycleMonth;
  document.querySelectorAll('[data-action="plus"],[data-action="minus"]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();adjustHours(b,b.dataset.action==="plus"?1:-1)});
  document.querySelectorAll('[data-action="hours"]').forEach(i=>{i.onclick=ev=>ev.stopPropagation();i.onchange=()=>setHours(i);i.onblur=()=>setHours(i)});
  document.querySelectorAll('[data-quick-delta]').forEach(b=>b.onclick=()=>adjustHoursBy(+b.dataset.y,+b.dataset.m,+b.dataset.d,+b.dataset.quickDelta));
  document.querySelectorAll('[data-preset-hours]').forEach(b=>b.onclick=()=>setPresetHours(+b.dataset.y,+b.dataset.m,+b.dataset.d,+b.dataset.presetHours));
  document.querySelectorAll('[data-template-day]').forEach(b=>b.onclick=()=>applyTemplateDay(+b.dataset.y,+b.dataset.m,+b.dataset.d));
  document.querySelectorAll('[data-toggle-month-lock]').forEach(b=>b.onclick=()=>toggleMonthLock(+b.dataset.y,+b.dataset.m));
  document.querySelectorAll('[data-open-day]').forEach(r=>r.onclick=ev=>{if(ev.target.closest('button,input,select'))return;view.selectedDay={y:+r.dataset.y,m:+r.dataset.m,d:+r.dataset.d};view.tab="month";view.scrolled=false;render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll('[data-clear-day]').forEach(b=>b.onclick=()=>clearDayHours(+b.dataset.y,+b.dataset.m,+b.dataset.d));
  document.querySelectorAll('[data-open-month]').forEach(r=>r.onclick=()=>{view.idx=+r.dataset.openMonth;view.tab="month";view.selectedDay=null;view.scrolled=false;render()});
  document.querySelectorAll('[data-switch-year]').forEach(b=>b.onclick=()=>switchYear(b.dataset.switchYear));
  const back=document.getElementById("backToMonth");if(back)back.onclick=()=>{view.selectedDay=null;view.scrolled=false;render()};
  const otm=document.getElementById("openTodayMonth");if(otm)otm.onclick=openMonthForToday;
  const sty=document.getElementById("switchTodayYear");if(sty)sty.onclick=()=>switchYear(sty.dataset.year,"today");
  const cty=document.getElementById("createTodayYear");if(cty)cty.onclick=createYearForToday;
  bindSettings();
}
function switchYear(id,targetTab=null){if(!state.years[id])return;state.activeYear=id;save();view.idx=initialMonthIndex();view.selectedDay=null;view.scrolled=false;if(targetTab)view.tab=targetTab;render()}
function cycleMonth(){const period=activePeriod(),labels=period.map((p,i)=>`${i+1}. ${MONTHS[p.m-1]} ${p.y}`).join("\n"),ans=prompt("Введите номер месяца:\n"+labels,String(view.idx+1)),n=Number(ans);if(Number.isInteger(n)&&n>=1&&n<=period.length){view.idx=n-1;view.scrolled=false;render()}}
function adjustHoursBy(y,m,d,delta){if(!ensureEditable(y,m))return;const e=getEntry(y,m,d),cur=Number(e.hours)||0,next=Math.max(0,Math.round((cur+delta)*100)/100);e.hours=next===0?null:next;save();render()}
function setPresetHours(y,m,d,h){if(!ensureEditable(y,m))return;getEntry(y,m,d).hours=Math.max(0,Number(h)||0)||null;save();render();toast(`${h} ч установлено`)}
function applyTemplateDay(y,m,d){if(!ensureEditable(y,m))return;const h=templateHoursFor(y,m,d);if(h<=0){toast("Для этого дня шаблон не задан");return}getEntry(y,m,d).hours=h;save();render();toast(`Установлено как обычно: ${num(h)} ч`)}
function clearDayHours(y,m,d){if(!ensureEditable(y,m))return;const e=getEntry(y,m,d);if(e.hours===null||typeof e.hours==="undefined")return;if(!confirm(`Очистить часы за ${d} ${MONTHS[m-1].toLowerCase()}?`))return;e.hours=null;save();render();toast("Часы за день очищены")}
function openMonthForToday(){const n=new Date(),id=yearIdForDate(n.getFullYear(),n.getMonth()+1);if(state.years[id]&&state.activeYear!==id)state.activeYear=id;const i=activePeriod().findIndex(p=>p.y===n.getFullYear()&&p.m===n.getMonth()+1);if(i>=0){view.idx=i;view.tab="month";view.selectedDay=null;view.scrolled=false;save();render()}}
function adjustHours(b,dir){const y=+b.dataset.y,m=+b.dataset.m,d=+b.dataset.d;if(!ensureEditable(y,m))return;const e=getEntry(y,m,d),step=+state.settings.hourStep||.5,cur=Number(e.hours)||0;e.hours=Math.max(0,Math.round((cur+dir*step)*100)/100);if(e.hours===0)e.hours=null;save();render()}
function setHours(i){const y=+i.dataset.y,m=+i.dataset.m,d=+i.dataset.d;if(!ensureEditable(y,m)){render();return}const e=getEntry(y,m,d),v=i.value.trim().replace(",",".");e.hours=v===""?null:Math.max(0,Number(v)||0);save();render()}
function toggleMonthLock(y,m){const mk=monthKey(y,m),closed=isMonthClosed(y,m),action=closed?"Разблокировать":"Закрыть";if(!confirm(`${action} ${MONTHS[m-1].toLowerCase()} ${y}?${closed?" После этого часы снова можно будет менять.":" После закрытия часы будут защищены от случайных изменений."}`))return;if(closed)delete activeYearData().closedMonths[mk];else activeYearData().closedMonths[mk]=true;save();render();toast(closed?"Месяц разблокирован":"Месяц закрыт")}
function bindSettings(){
  const w=document.getElementById("weekdayRate"),we=document.getElementById("weekendRate"),hs=document.getElementById("hourStep");if(w)w.onchange=()=>{state.settings.weekdayRate=Math.max(0,+w.value||0);save();render()};if(we)we.onchange=()=>{state.settings.weekendRate=Math.max(0,+we.value||0);save();render()};if(hs)hs.onchange=()=>{state.settings.hourStep=Math.max(.1,+hs.value||.5);save();render()};
  document.querySelectorAll('[data-template-setting]').forEach(i=>i.onchange=()=>{const wd=String(i.dataset.templateSetting);state.settings.templates[wd]=Math.max(0,+String(i.value).replace(",",".")||0);save();render()});
  const cn=document.getElementById("createNextYear");if(cn)cn.onclick=createNextYear;const ra=document.getElementById("resetActiveYear");if(ra)ra.onclick=resetActiveYear;
  const a=document.getElementById("saveHtml");if(a)a.onclick=downloadHtmlSnapshot;const j=document.getElementById("exportJson");if(j)j.onclick=exportJson;const ij=document.getElementById("importJson");if(ij)ij.onclick=()=>document.getElementById("fileInput").click();const fi=document.getElementById("fileInput");if(fi)fi.onchange=importJson;const c=document.getElementById("exportCsv");if(c)c.onclick=exportCsv;
  const ia=document.getElementById("installApp");if(ia){ia.disabled=isStandaloneMode();ia.textContent=isStandaloneMode()?"Приложение установлено":"Установить на телефон";ia.onclick=installPwa}
}
function createNextYear(){const maxStart=Math.max(...Object.values(state.years).map(y=>y.startYear)),next=maxStart+1,id=academicId(next);if(state.years[id]){switchYear(id);return}if(!confirm(`Создать пустой учебный год ${academicLabel(next)}?`))return;state.years[id]=blankYear(next);state.activeYear=id;save();view.idx=0;view.tab="month";view.selectedDay=null;render();toast(`Создан ${academicLabel(next)}`)}
function createYearForToday(){const n=new Date(),sy=inferStartYear(n.getFullYear(),n.getMonth()+1),id=academicId(sy);if(!state.years[id])state.years[id]=blankYear(sy);switchYear(id,"today")}
function resetActiveYear(){const id=state.activeYear,sy=activeStartYear();if(!confirm(`Сбросить все часы и закрытые месяцы только за ${academicLabel(sy)}? Другие учебные годы останутся без изменений.`))return;const seed=FACTORY.years[id]?clone(FACTORY.years[id]):blankYear(sy);state.years[id]=seed;save();view.idx=initialMonthIndex();view.selectedDay=null;render();toast(`${academicLabel(sy)} сброшен`)}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJson(){save();downloadBlob(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`hours_all_years_backup_${new Date().toISOString().slice(0,10)}.json`);toast("Резервная копия создана")}
function importJson(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);const incoming=normalizeState(x);if(!confirm(`Импортировать резервную копию? Текущие данные в приложении будут заменены.`))return;state=incoming;save();view.idx=initialMonthIndex();view.selectedDay=null;render();toast("Резервная копия восстановлена")}catch(e){alert("Не удалось прочитать резервную копию")}};rd.readAsText(f);ev.target.value=""}
function exportCsv(){
  const lines=[["Учебный год","Дата","День недели","Часы","Ставка","Сумма"]],prev=state.activeYear;
  for(const id of sortedYearIds()){state.activeYear=id;for(const p of activePeriod()){for(let d=1;d<=daysIn(p.y,p.m);d++){const e=getEntry(p.y,p.m,d),h=e.hours??"";if(h==="")continue;const inf=dateInfo(p.y,p.m,d);lines.push([academicLabel(activeStartYear()),key(p.y,p.m,d),WD_FULL[inf.wd],h,rateFor(p.y,p.m,d),dayAmount(p.y,p.m,d)])}}}
  state.activeYear=prev;const csv="\uFEFF"+lines.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),"hours_all_years.csv");toast("CSV создан")
}
function downloadHtmlSnapshot(){save();const cloneDoc=document.documentElement.cloneNode(true),app=cloneDoc.querySelector("#app");if(app)app.innerHTML="";const emb=cloneDoc.querySelector("#embedded-data"),snap=clone(state);snap.updatedAt=new Date().toISOString();emb.textContent=JSON.stringify(snap).replace(/</g,"\\u003c");const toastEl=cloneDoc.querySelector("#toast");if(toastEl){toastEl.className="toast";toastEl.textContent=""}const out="<!DOCTYPE html>\n"+cloneDoc.outerHTML;downloadBlob(new Blob([out],{type:"text/html;charset=utf-8"}),`Учёт_часов_${new Date().toISOString().slice(0,10)}.html`);toast("HTML с текущими данными создан")}
function scrollTodayOnce(){if(view.scrolled)return;requestAnimationFrame(()=>{const el=document.querySelector(".day-row.today");if(el){el.scrollIntoView({block:"center"});view.scrolled=true}})}
render();

</script>
</body>
</html>
